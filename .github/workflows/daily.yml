name: Daily refresh

on:
  schedule:
    - cron: "30 6 * * 1-5"   # 06:30 UTC weekdays (07:30 London in summer, 06:30 in winter)
  workflow_dispatch:          # adds a "Run workflow" button for manual refreshes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python build_page.py 2>&1 | tee build_log.txt
      - name: Save data cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ build_log.txt || true
          git commit -m "Data refresh $(date -u +%F)" || echo "No data changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
